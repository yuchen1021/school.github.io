<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouBike 2.0 智能看板</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        :root {
            --primary-color: #f39c12;
            --secondary-color: #2c3e50;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #7f8c8d;
            --success-color: #27ae60;
            --danger-color: #e74c3c;
            --shadow: 0 8px 16px rgba(0, 0, 0, 0.06);
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif, "Microsoft JhengHei";
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            width: 100%;
            max-width: 1000px;
        }

        h1 {
            color: var(--secondary-color);
            font-size: 2.2rem;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .controls-wrapper {
            width: 100%;
            max-width: 800px;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: var(--shadow);
        }

        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 12px 20px;
            border: 2px solid #ecf0f1;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        /* 新增下拉選單樣式 */
        .district-select {
            padding: 12px 15px;
            border: 2px solid #ecf0f1;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            background-color: white;
            cursor: pointer;
            color: var(--text-main);
            min-width: 140px;
        }

        .district-select:focus {
            border-color: var(--primary-color);
        }

        button {
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition);
            border: none;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover { background-color: #e67e22; }
        
        .btn-secondary {
            background-color: var(--secondary-color);
            color: white;
        }

        .btn-secondary:hover { background-color: #34495e; }

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            border-top: 1px solid #ecf0f1;
            padding-top: 15px;
        }

        .filter-toggle {
            background: #ecf0f1;
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            user-select: none;
            transition: var(--transition);
            border: 2px solid transparent;
        }

        .filter-toggle.active {
            background: #fff8e1;
            color: var(--primary-color);
            border-color: var(--primary-color);
            font-weight: bold;
        }

        .refresh-status {
            margin-left: auto;
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .refresh-bar {
            width: 60px;
            height: 6px;
            background: #ecf0f1;
            border-radius: 3px;
            overflow: hidden;
        }

        .refresh-progress {
            height: 100%;
            background: var(--success-color);
            width: 100%;
            transition: width 1s linear;
        }

        #map {
            width: 100%;
            max-width: 1000px;
            height: 350px;
            border-radius: 16px;
            margin-bottom: 10px;
            box-shadow: var(--shadow);
            border: 2px solid #ecf0f1;
            z-index: 1;
        }

        .map-hint {
            width: 100%;
            max-width: 1000px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        .dashboard {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: var(--shadow);
            border-top: 5px solid var(--primary-color);
            transition: var(--transition);
            animation: fadeIn 0.4s ease-out forwards;
            display: flex;
            flex-direction: column;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
        }

        .card-header {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: var(--secondary-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-body {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background: #f8f9fa;
            padding: 15px 10px;
            border-radius: 12px;
            text-align: center;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .info-item:not(:last-child) {
            border-right: 1px solid #e9ecef;
        }

        .info-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 5px;
            font-weight: bold;
        }

        .info-value {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--primary-color);
        }

        .info-value.secondary { color: var(--success-color); }
        .info-value.muted { color: #95a5a6; font-size: 1.2rem; }
        
        /* 數值為 0 時的警告色 */
        .info-value.danger { color: var(--danger-color); }

        .status-footer {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .distance-badge {
            background: #e8f4f8;
            color: #3498db;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        #message {
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            width: 100%;
            max-width: 800px;
            text-align: center;
            line-height: 1.5;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            background: white;
            border-radius: 16px;
            border: 2px dashed #ecf0f1;
        }
    </style>
</head>
<body>

    <header>
        <h1>YouBike 2.0 智能看板</h1>
        <p class="subtitle">即時掌握台北市公共自行車租借與還車空位</p>
    </header>

    <div id="message"></div>

    <div class="controls-wrapper">
        <div class="search-container">
            <!-- 新增行政區下拉選單 -->
            <select id="districtSelect" class="district-select">
                <option value="">所有行政區</option>
            </select>
            <input type="text" id="searchInput" placeholder="搜尋站點 (例如：捷運、科技大樓)...">
            <button id="locationBtn" class="btn-secondary">自動定位</button>
            <button id="refreshBtn" class="btn-primary">手動更新</button>
        </div>
        <div class="filters">
            <div id="filterBikes" class="filter-toggle">只看有車可借</div>
            <div id="filterSlots" class="filter-toggle">只看有位可還</div>
            <div class="refresh-status">
                <span id="countdownText">更新倒數 60s</span>
                <div class="refresh-bar"><div id="refreshProgress" class="refresh-progress"></div></div>
            </div>
        </div>
    </div>

    <div id="map"></div>
    <div class="map-hint">提示：可以直接在地圖上「點擊」來指定您的位置，系統會自動重新計算距離。</div>

    <div id="dashboard" class="dashboard"></div>

    <script>
        const API_URL = 'https://tcgbusfs.blob.core.windows.net/dotapp/youbike/v2/youbike_immediate.json';
        
        let allStations = [];
        let userLocation = null; 
        
        let map = null;
        let markersLayer = null;
        let userMarker = null;

        // 狀態與計時器
        let showOnlyBikes = false;
        let showOnlySlots = false;
        let autoRefreshTimer = null;
        let countdownValue = 60;
        
        const dashboard = document.getElementById('dashboard');
        const refreshBtn = document.getElementById('refreshBtn');
        const locationBtn = document.getElementById('locationBtn');
        const searchInput = document.getElementById('searchInput');
        const districtSelect = document.getElementById('districtSelect'); // 新增選單節點
        const messageBox = document.getElementById('message');
        
        const filterBikesBtn = document.getElementById('filterBikes');
        const filterSlotsBtn = document.getElementById('filterSlots');
        const countdownText = document.getElementById('countdownText');
        const refreshProgress = document.getElementById('refreshProgress');

        function formatName(name) {
            return name ? name.replace('YouBike2.0_', '') : '未知站點';
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const p1 = lat1 * Math.PI / 180;
            const p2 = lat2 * Math.PI / 180;
            const dp = (lat2 - lat1) * Math.PI / 180;
            const dl = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dp/2) * Math.sin(dp/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) * Math.sin(dl/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function formatDistance(meters) {
            if (meters < 1000) return Math.round(meters) + ' m';
            return (meters / 1000).toFixed(1) + ' km';
        }

        function initMap() {
            map = L.map('map').setView([25.0394, 121.5133], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            markersLayer = L.layerGroup().addTo(map);

            map.on('click', function(e) {
                userLocation = { lat: e.latlng.lat, lng: e.latlng.lng };
                locationBtn.style.backgroundColor = '#3498db'; 
                locationBtn.textContent = '已手動定位';
                messageBox.style.display = 'none'; 
                
                updateUserMarker();
                filterAndRender();
            });
        }

        function getUserLocation() {
            if (!navigator.geolocation) {
                userLocation = { lat: 25.0394, lng: 121.5133 };
                updateUserMarker();
                filterAndRender();
                return;
            }

            locationBtn.disabled = true;
            locationBtn.textContent = '定位中...';

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    userLocation = { lat: position.coords.latitude, lng: position.coords.longitude };
                    locationBtn.disabled = false;
                    locationBtn.style.backgroundColor = '#27ae60'; 
                    locationBtn.textContent = '定位成功';
                    updateUserMarker();
                    filterAndRender();
                },
                (error) => {
                    messageBox.innerHTML = "注意：無法獲取自動定位。請直接在<b>地圖上點擊</b>設定您的位置！";
                    messageBox.style.background = '#fff3cd';
                    messageBox.style.color = '#856404';
                    messageBox.style.display = 'block';
                    
                    userLocation = { lat: 25.0394, lng: 121.5133 };
                    locationBtn.disabled = false;
                    locationBtn.textContent = '自動定位';
                    updateUserMarker();
                    filterAndRender();
                },
                { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
            );
        }

        function extractData(station) {
            let result = { available: 0, empty: 0, total: 0, time: '' };
            let timeStr = station.mday || station.srcUpdateTime || station.updateTime || '';
            if (timeStr) {
                let parts = timeStr.split(' ');
                if (parts.length > 1) {
                    result.time = parts[1].substring(0, 5); 
                } else if (timeStr.length >= 16) {
                    result.time = timeStr.substring(11, 16);
                } else {
                    result.time = timeStr;
                }
            }

            let lowerKeys = {};
            for (let k in station) {
                if (Object.prototype.hasOwnProperty.call(station, k)) lowerKeys[k.toLowerCase()] = station[k];
            }

            const availKeys = ['sbi', 'available_rent_bikes', 'available_bikes', 'rent_bikes'];
            for (let k of availKeys) {
                if (lowerKeys[k] !== undefined && lowerKeys[k] !== null) { result.available = parseInt(lowerKeys[k]) || 0; break; }
            }

            const emptyKeys = ['bemp', 'available_return_bikes', 'available_return_slots', 'empty_spaces'];
            for (let k of emptyKeys) {
                if (lowerKeys[k] !== undefined && lowerKeys[k] !== null) { result.empty = parseInt(lowerKeys[k]) || 0; break; }
            }

            const totalKeys = ['tot', 'quantity', 'total_spaces', 'total', 'capacity'];
            for (let k of totalKeys) {
                if (lowerKeys[k] !== undefined && lowerKeys[k] !== null) { result.total = parseInt(lowerKeys[k]) || 0; break; }
            }

            const latKeys = ['lat', 'latitude'];
            const lngKeys = ['lng', 'longitude', 'lon'];
            for (let k of latKeys) {
                if (lowerKeys[k] !== undefined) { result.lat = parseFloat(lowerKeys[k]); break; }
            }
            for (let k of lngKeys) {
                if (lowerKeys[k] !== undefined) { result.lng = parseFloat(lowerKeys[k]); break; }
            }

            return result;
        }

        function updateUserMarker() {
            if (!map || !userLocation) return;
            if (userMarker) map.removeLayer(userMarker);
            
            userMarker = L.circleMarker([userLocation.lat, userLocation.lng], {
                color: '#e74c3c', fillColor: '#e74c3c', fillOpacity: 1, radius: 8
            }).bindPopup('<b>您設定的位置</b>').addTo(map);
            
            map.flyTo([userLocation.lat, userLocation.lng], 16);
        }

        // 自動更新計時器邏輯
        function startAutoRefresh() {
            if (autoRefreshTimer) clearInterval(autoRefreshTimer);
            countdownValue = 60;
            updateCountdownUI();

            autoRefreshTimer = setInterval(() => {
                countdownValue--;
                updateCountdownUI();
                if (countdownValue <= 0) {
                    loadData(false); // 自動背景更新
                }
            }, 1000);
        }

        function updateCountdownUI() {
            countdownText.textContent = `更新倒數 ${countdownValue}s`;
            refreshProgress.style.width = `${(countdownValue / 60) * 100}%`;
            // 倒數低於10秒變色提醒
            if (countdownValue <= 10) {
                refreshProgress.style.background = '#e74c3c';
            } else {
                refreshProgress.style.background = '#27ae60';
            }
        }

        async function loadData(isManual = true) {
            if (isManual) {
                refreshBtn.disabled = true;
                refreshBtn.textContent = '更新中...';
            }
            
            try {
                const response = await fetch(`${API_URL}?t=${Date.now()}`);
                if (!response.ok) throw new Error("連線失敗");
                
                const data = await response.json();
                allStations = Array.isArray(data) ? data : (data.retVal ? Object.values(data.retVal) : []);
                
                if (allStations.length === 0) throw new Error("資料格式不正確");

                // 動態生成行政區選項 (僅在第一次載入時生成，避免覆蓋使用者的選擇)
                if (districtSelect.options.length <= 1) {
                    const districts = new Set();
                    allStations.forEach(s => {
                        if (s.sarea) districts.add(s.sarea);
                    });
                    
                    // 依照筆畫或拼音排序後加入選單
                    Array.from(districts).sort().forEach(d => {
                        const opt = document.createElement('option');
                        opt.value = d;
                        opt.textContent = d;
                        districtSelect.appendChild(opt);
                    });
                }

                filterAndRender();
                startAutoRefresh(); // 成功後重啟計時器

            } catch (error) {
                console.error(error);
                if (isManual) {
                    messageBox.textContent = "資料更新失敗：" + error.message;
                    messageBox.style.background = '#fee';
                    messageBox.style.color = '#c0392b';
                    messageBox.style.display = 'block';
                }
            } finally {
                if (isManual) {
                    refreshBtn.disabled = false;
                    refreshBtn.textContent = '手動更新';
                }
            }
        }

        function filterAndRender() {
            const query = searchInput.value.trim().toLowerCase();
            const selectedDistrict = districtSelect.value; // 取得選擇的行政區

            let filtered = allStations.filter(s => {
                const matchSearch = s.sna.toLowerCase().includes(query) || (s.ar && s.ar.toLowerCase().includes(query));
                // 檢查是否符合選擇的行政區
                const matchDistrict = selectedDistrict === "" || s.sarea === selectedDistrict;
                
                return matchSearch && matchDistrict;
            });

            // 套用過濾器邏輯
            if (showOnlyBikes || showOnlySlots) {
                filtered = filtered.filter(s => {
                    const data = extractData(s);
                    let passBikes = !showOnlyBikes || data.available > 0;
                    let passSlots = !showOnlySlots || data.empty > 0;
                    return passBikes && passSlots;
                });
            }

            if (userLocation) {
                filtered.forEach(s => {
                    const data = extractData(s);
                    if (data.lat && data.lng) {
                        s._distance = calculateDistance(userLocation.lat, userLocation.lng, data.lat, data.lng);
                    } else {
                        s._distance = Infinity;
                    }
                });
                filtered.sort((a, b) => a._distance - b._distance);
            }

            render(filtered.slice(0, 15));
        }

        function render(stations) {
            dashboard.innerHTML = '';
            if (markersLayer) markersLayer.clearLayers();
            let bounds = [];

            if (stations.length === 0) {
                dashboard.innerHTML = '<div class="empty-state">找不到符合條件的站點，請嘗試調整搜尋或篩選條件。</div>';
                return;
            }

            stations.forEach((s, index) => {
                const data = extractData(s);

                // --- 繪製地圖標記 ---
                if (data.lat && data.lng && markersLayer) {
                    // 若數值為0在地圖上以紅色標示
                    const availStyle = data.available === 0 ? "color: #e74c3c;" : "color: #f39c12;";
                    const emptyStyle = data.empty === 0 ? "color: #e74c3c;" : "color: #27ae60;";

                    const marker = L.marker([data.lat, data.lng]).bindPopup(`
                        <div style="text-align: center;">
                            <b style="color: #2c3e50; font-size:1.1em;">${formatName(s.sna)}</b><br>
                            <div style="margin-top: 5px;">
                                借: <b style="${availStyle} font-size:1.2em;">${data.available}</b> | 
                                還: <b style="${emptyStyle} font-size:1.2em;">${data.empty}</b>
                            </div>
                        </div>
                    `);
                    markersLayer.addLayer(marker);
                    bounds.push([data.lat, data.lng]);
                }

                let distanceHtml = '';
                if (s._distance !== undefined && s._distance !== Infinity) {
                    distanceHtml = `<span class="distance-badge">${formatDistance(s._distance)}</span>`;
                }

                // 判斷庫存是否為 0，套用警告樣式
                const availClass = data.available === 0 ? "info-value danger" : "info-value";
                const emptyClass = data.empty === 0 ? "info-value secondary danger" : "info-value secondary";

                const card = document.createElement('div');
                card.className = 'card';
                card.style.animationDelay = `${index * 0.05}s`;

                card.innerHTML = `
                    <div class="card-header">
                        <span>${formatName(s.sna)}</span>
                        ${distanceHtml}
                    </div>
                    <div class="card-body">
                        <div class="info-item">
                            <span class="info-label">可借</span>
                            <span class="${availClass}">${data.available}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">可還</span>
                            <span class="${emptyClass}">${data.empty}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">總車位</span>
                            <span class="info-value muted">${data.total}</span>
                        </div>
                    </div>
                    <div class="status-footer">
                        <span style="font-size: 0.7rem; color: #7f8c8d;">正常營運</span>
                        <span style="font-size: 0.75rem; color: #95a5a6;">${data.time} 更新</span>
                    </div>
                `;
                dashboard.appendChild(card);
            });

            if (bounds.length > 0 && map && !userLocation && searchInput.value.trim() !== '') {
                map.fitBounds(bounds, { padding: [30, 30], maxZoom: 15 });
            }
        }

        // 事件監聽與綁定
        refreshBtn.addEventListener('click', () => loadData(true));
        locationBtn.addEventListener('click', getUserLocation);
        searchInput.addEventListener('input', filterAndRender);
        districtSelect.addEventListener('change', filterAndRender); // 綁定下拉選單事件

        filterBikesBtn.addEventListener('click', function() {
            showOnlyBikes = !showOnlyBikes;
            this.classList.toggle('active', showOnlyBikes);
            filterAndRender();
        });

        filterSlotsBtn.addEventListener('click', function() {
            showOnlySlots = !showOnlySlots;
            this.classList.toggle('active', showOnlySlots);
            filterAndRender();
        });

        initMap();
        loadData();
    </script>
</body>
</html>
